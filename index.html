<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShortFlix</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
}

header{
    background:#e50914;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

    header .logo{
    width:40px;
    height:40px;
    vertical-align:middle;
    margin-right:8px;
    border-radius:8px; /* Optional */
}

header span{
    vertical-align:middle;
}

    header p{
    margin-top:8px;
    font-size:14px;
    font-weight:normal;
    color:#fff;
    }

    .header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#installBtn{
    display:none;
    background:#fff;
    color:#e50914;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}
    
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:#1b1b1b;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h3{
    padding:10px;
    text-align:center;
    font-size:15px;
}

    .card p{
    font-size:12px;
    color:#bbb;
    padding:0 10px 10px;
    line-height:1.4;
    max-height:34px;
    overflow:hidden;
    text-align:center;
    }
</style>

    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e50914">

</head>
<body>

<header>

    <div class="header-top">
        <div>
            <img src="images/applogo192.jpg" alt="ShortFlix Logo" class="logo">
            <span>ShortFlix</span>
        </div>

        <button id="installBtn">Install</button>
    </div>

    <p>Watch the best short series for free anytime, anywhere.</p>

</header>

<div class="grid" id="grid"></div>

<script>
fetch("series.json")
.then(r=>r.json())
.then(data=>{

const grid=document.getElementById("grid");

data.forEach(series=>{

grid.innerHTML += `
<div class="card" onclick="location='watch.html?id=${series.id}'">

    <img src="images/${series.thumbnail}">
    <h3>${series.title}</h3>
    <p>${series.genre}</p>

</div>
`;

});
});
</script>

    <script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
    </script>

    <script>
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;

    if (outcome === "accepted") {
        installBtn.style.display = "none";
    }

    deferredPrompt = null;
});

window.addEventListener("appinstalled", () => {
    installBtn.style.display = "none";
});
    </script>

</body>
</html>
