<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShortFlix</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    background:#e50914;
    padding:15px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

header p{
    margin-top:8px;
    font-size:14px;
    font-weight:normal;
    color:#fff;
}

h2{
    padding:15px 15px 5px;
    margin:0;
}

#description{
    padding:0 15px 15px;
    color:#ccc;
    font-size:14px;
    line-height:1.5;
}

#player{
    width:100%;
    height:220px;
    border:none;
    display:none;
}

.episode{
    background:#222;
    margin:10px 15px;
    padding:15px;
    border-radius:8px;
    cursor:pointer;
    transition:background .2s;
}

.episode:hover{
    background:#333;
}
</style>

</head>
<body>

<header>
    🎬 ShortFlix
    <p>Watch the best short series for free anytime, anywhere.</p>
</header>

<h2 id="title"></h2>

<p id="description"></p>

<iframe id="player" allowfullscreen></iframe>

<div id="episodes"></div>

<script>

const id = new URLSearchParams(location.search).get("id");

fetch("series.json")
.then(r => r.json())
.then(data => {

    const series = data.find(x => x.id === id);

    if(!series){
        document.getElementById("title").textContent = "Series not found";
        return;
    }

    document.getElementById("title").textContent = series.title;
    document.getElementById("description").textContent = series.description;

    const list = document.getElementById("episodes");

    series.episodes.forEach(ep => {

        list.innerHTML += `
        <div class="episode"
             onclick="window.location.href='${ep.url}'">
            ${ep.title}
        </div>
        `;

    });

});

</script>

</body>
</html>
